<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配達エリア判定</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d232b; --muted: #5f6b7a;
    --border: #dde2e8; --accent: #1971c2; --ok: #2b8a3e; --ng: #c92a2a;
    --warn-bg: #fff4e6; --warn-text: #a14a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181d; --panel: #1f242b; --text: #e6e9ed; --muted: #9aa5b1;
      --border: #333b45; --accent: #4dabf7; --ok: #69db7c; --ng: #ff8787;
      --warn-bg: #3a2a14; --warn-text: #ffc078;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181d; --panel: #1f242b; --text: #e6e9ed; --muted: #9aa5b1;
    --border: #333b45; --accent: #4dabf7; --ok: #69db7c; --ng: #ff8787;
    --warn-bg: #3a2a14; --warn-text: #ffc078;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  h1 { font-size: 1.05rem; margin: 0 0 8px; }
  form { display: flex; gap: 8px; }
  input[type=search] {
    flex: 1; min-width: 0; padding: 8px 10px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text);
  }
  button {
    padding: 8px 14px; font-size: .95rem; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  .samples { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
  .samples button {
    padding: 3px 9px; font-size: .8rem; background: transparent; color: var(--text); border-color: var(--border);
  }
  main { flex: 1; display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  #map { height: 100%; min-height: 360px; }
  aside { background: var(--panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
  aside h2 { font-size: .9rem; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  aside h2:first-child { margin-top: 0; }
  .verdict { font-size: 1.15rem; font-weight: 700; margin: 4px 0 6px; }
  .verdict.ok { color: var(--ok); }
  .verdict.ng { color: var(--ng); }
  .where { color: var(--muted); font-size: .85rem; word-break: break-all; }
  .warn { background: var(--warn-bg); color: var(--warn-text); padding: 8px 10px; border-radius: 6px; font-size: .85rem; margin: 10px 0; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; transform: translateY(1px); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: .85rem; }
  .candidates button {
    display: block; width: 100%; text-align: left; margin: 4px 0; padding: 6px 8px;
    background: transparent; color: var(--text); border-color: var(--border); font-size: .85rem;
  }
  .legend label { display: flex; gap: 6px; align-items: center; font-size: .85rem; margin: 6px 0; }
  .hint { color: var(--muted); font-size: .85rem; line-height: 1.6; }
  .store-label { background: transparent; border: none; box-shadow: none; font-weight: 700; font-size: 12px; }
  .store-label::before { display: none; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    aside { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>配達エリア判定（横浜・本牧・磯子）</h1>
  <form id="search">
    <input type="search" id="q" placeholder="お届け先の住所（例：横浜市中区山下町）" autocomplete="off">
    <button type="submit">判定</button>
  </form>
  <div class="samples" id="samples">サンプル：</div>
</header>
<main>
  <div id="map"></div>
  <aside>
    <div id="result">
      <h2>使い方</h2>
      <p class="hint">住所を入力するか、地図をクリックすると、その地点に配達できる店舗を判定します。<br>
      塗りの濃いエリアは配送料無料の近距離ゾーン、点線のエリアは遠距離ゾーンです。</p>
    </div>
    <h2>表示</h2>
    <div class="legend" id="legend"></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SAMPLES = [
  { label: "ランドマークタワー", lat: 35.4547, lon: 139.6314 },
  { label: "横浜駅", lat: 35.4658, lon: 139.6223 },
  { label: "赤レンガ倉庫", lat: 35.4528, lon: 139.6427 },
  { label: "中華街", lat: 35.4425, lon: 139.6455 },
  { label: "山下公園", lat: 35.4460, lon: 139.6505 },
  { label: "野毛", lat: 35.4475, lon: 139.6290 },
  { label: "本牧", lat: 35.4228, lon: 139.6611 },
  { label: "磯子駅", lat: 35.4010, lon: 139.6190 },
  { label: "根岸駅（エリアの谷間）", lat: 35.4173, lon: 139.6363 },
  { label: "港の海上", lat: 35.4600, lon: 139.6480 },
  { label: "弘明寺（エリア外）", lat: 35.4245, lon: 139.5985 },
];

const map = L.map("map").setView([35.452, 139.632], 14);
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>',
}).addTo(map);

const zoneLayers = new Map();   // zone_id -> Leaflet layer
let pinMarker = null;

function zoneStyle(p, highlighted = false) {
  const near = p.tier === 1;
  return {
    color: p.color,
    weight: highlighted ? 4 : (near ? 2 : 1.5),
    dashArray: near ? null : "6 5",
    fillColor: p.color,
    fillOpacity: highlighted ? 0.35 : (near ? 0.18 : 0.06),
  };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const feeText = fee => fee === 0 ? "配送料 無料" : `配送料 ${fee}円`;
const tierText = tier => tier === 1 ? "近距離ゾーン" : "遠距離ゾーン";
const distText = m => m >= 1000 ? `約 ${(m / 1000).toFixed(1)} km` : `約 ${m} m`;

async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status}`);
  return res.json();
}

async function loadLayers() {
  const [zones, stores, sea] = await Promise.all([
    getJson("/api/zones"), getJson("/api/stores"), getJson("/api/sea"),
  ]);

  const seaLayer = L.geoJSON(sea, {
    style: { color: "#4dabf7", weight: 1, dashArray: "2 4", fillColor: "#4dabf7", fillOpacity: 0.12 },
    interactive: false,
  });

  const zoneGroup = L.geoJSON(zones, {
    style: f => zoneStyle(f.properties),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      zoneLayers.set(p.zone_id, layer);
      layer.bindTooltip(`${p.name}：${tierText(p.tier)}（${feeText(p.fee)}）${p.shape === "circle" ? "・円形" : ""}`, { sticky: true });
    },
  }).addTo(map);
  // No animation, so a deep-link setView right after this isn't swallowed mid-zoom.
  map.fitBounds(zoneGroup.getBounds(), { padding: [10, 10], animate: false });

  const storeGroup = L.layerGroup(stores.features.map(f => {
    const [lon, lat] = f.geometry.coordinates;
    return L.circleMarker([lat, lon], {
      radius: 7, color: "#fff", weight: 2, fillColor: f.properties.color, fillOpacity: 1,
    }).bindTooltip(f.properties.name, { permanent: true, direction: "right", className: "store-label" });
  })).addTo(map);

  const legend = document.getElementById("legend");
  const toggles = [
    ["配達ゾーン", zoneGroup, true],
    ["店舗", storeGroup, true],
    ["海域（判定用のおおまかな範囲）", seaLayer, false],
  ];
  for (const [label, layer, on] of toggles) {
    const el = document.createElement("label");
    el.innerHTML = `<input type="checkbox" ${on ? "checked" : ""}> ${label}`;
    el.querySelector("input").addEventListener("change", e => e.target.checked ? layer.addTo(map) : layer.remove());
    legend.appendChild(el);
  }
}

function highlightZones(zoneIds) {
  for (const [id, layer] of zoneLayers) {
    const p = layer.feature.properties;
    const on = zoneIds.has(id);
    layer.setStyle(zoneStyle(p, on));
    if (on) layer.bringToFront();
  }
}

async function checkPoint(lat, lon, label) {
  if (pinMarker) pinMarker.remove();
  pinMarker = L.marker([lat, lon]).addTo(map);

  let body;
  try {
    body = await getJson(`/api/check?lat=${lat}&lon=${lon}`);
  } catch (e) {
    renderMessage("判定に失敗しました。API が起動しているか確認してください。");
    return;
  }
  highlightZones(new Set(body.available.map(r => r.zone_id)));
  renderResult(body, label);
}

function renderMessage(text, extraHtml = "") {
  document.getElementById("result").innerHTML = `<p class="hint">${escapeHtml(text)}</p>${extraHtml}`;
}

function renderResult(body, label) {
  const { available, unavailable, on_water, point } = body;
  const where = label ? escapeHtml(label) : `${point.lat.toFixed(5)}, ${point.lon.toFixed(5)}`;
  let html = "";

  if (available.length) {
    html += `<div class="verdict ok">✅ 配達できます（${available.length}店舗）</div>`;
  } else {
    html += `<div class="verdict ng">❌ 配達エリア外です</div>`;
  }
  html += `<div class="where">${where}</div>`;

  if (on_water && available.length) {
    html += `<div class="warn">⚠ この地点は海上です。円形のゾーンは海の上まで広がるため、「配達できる」と判定されてしまいます。</div>`;
  } else if (on_water) {
    html += `<div class="warn">⚠ この地点は海上です。</div>`;
  }

  if (available.length) {
    html += `<h2>配達できる店舗</h2><ul class="list">` + available.map(r => `
      <li><span class="dot" style="background:${r.color}"></span>
        <div><div class="name">${escapeHtml(r.name)}</div>
        <div class="meta">${feeText(r.fee)} ／ 約${r.eta_min}分 ／ ${tierText(r.tier)}${r.shape === "circle" ? "（円形）" : ""}</div></div></li>`).join("") + `</ul>`;
  } else if (unavailable.length) {
    const n = unavailable[0];
    html += `<p class="hint">最寄りは <b>${escapeHtml(n.name)}</b> の配達エリアで、ここから${distText(n.distance_m)}離れています。</p>`;
  }

  if (unavailable.length) {
    html += `<h2>エリア外の店舗</h2><ul class="list">` + unavailable.map(r => `
      <li><span class="dot" style="background:${r.color}"></span>
        <div><div class="name">${escapeHtml(r.name)}</div>
        <div class="meta">エリアまで${distText(r.distance_m)}</div></div></li>`).join("") + `</ul>`;
  }
  document.getElementById("result").innerHTML = html;
}

async function search(q) {
  renderMessage("住所を検索しています…");
  let body;
  try {
    body = await getJson(`/api/geocode?q=${encodeURIComponent(q)}`);
  } catch (e) {
    renderMessage("住所検索サービスに接続できませんでした。地図をクリックして判定することもできます。");
    return;
  }
  const [first, ...rest] = body.candidates;
  if (!first) {
    renderMessage("住所が見つかりませんでした。表記を変えるか、地図をクリックしてください。");
    return;
  }
  map.setView([first.lat, first.lon], Math.max(map.getZoom(), 15));
  await checkPoint(first.lat, first.lon, first.title);

  // GSI search matches addresses only, so landmark names can hit unrelated places.
  if (!first.title.includes("横浜市")) {
    const warn = document.createElement("div");
    warn.className = "warn";
    warn.textContent = "横浜市内の住所が見つかりませんでした。施設名ではなく住所（例：横浜市中区新港一丁目）で検索してください。";
    document.getElementById("result").prepend(warn);
  }

  if (rest.length) {
    const box = document.createElement("div");
    box.className = "candidates";
    box.innerHTML = "<h2>ほかの候補</h2>";
    for (const c of rest) {
      const b = document.createElement("button");
      b.textContent = c.title;
      b.addEventListener("click", () => {
        map.setView([c.lat, c.lon], Math.max(map.getZoom(), 15));
        checkPoint(c.lat, c.lon, c.title);
      });
      box.appendChild(b);
    }
    document.getElementById("result").appendChild(box);
  }
}

document.getElementById("search").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (q) search(q);
});

map.on("click", e => checkPoint(e.latlng.lat, e.latlng.lng, null));

const samplesEl = document.getElementById("samples");
for (const s of SAMPLES) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = s.label;
  b.addEventListener("click", () => {
    map.setView([s.lat, s.lon], Math.max(map.getZoom(), 15));
    checkPoint(s.lat, s.lon, s.label);
  });
  samplesEl.appendChild(b);
}

// Optional deep link: ?lat=..&lon=..&label=..&zoom=..&sea=1
function applyUrlParams() {
  const params = new URLSearchParams(location.search);
  if (params.get("sea") === "1") document.querySelectorAll("#legend input")[2]?.click();
  const lat = parseFloat(params.get("lat"));
  const lon = parseFloat(params.get("lon"));
  if (Number.isFinite(lat) && Number.isFinite(lon)) {
    map.setView([lat, lon], parseInt(params.get("zoom"), 10) || 15);
    checkPoint(lat, lon, params.get("label"));
  }
}

loadLayers()
  .then(applyUrlParams)
  .catch(() => renderMessage("ゾーン情報を読み込めませんでした。API が起動しているか確認してください。"));
</script>
</body>
</html>
